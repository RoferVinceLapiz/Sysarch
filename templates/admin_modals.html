/* =========================================================
   REUSABLE ADMIN SEARCH MODAL + SIT-IN FORM
========================================================= */

.admin-search-overlay,
#sitInFormModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: rgba(15, 15, 20, 0.72);
    backdrop-filter: blur(9px);
    justify-content: center;
    padding: 24px;
}

/* SEARCH MODAL */
.admin-search-overlay {
    align-items: flex-start;
    overflow-y: auto;
}

.admin-search-modal {
    width: min(820px, 100%);
    max-height: 86vh;
    overflow: hidden;
    border-radius: 24px;
    background: #ffffff;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
    display: flex;
    flex-direction: column;
}

.admin-search-header,
.admin-sitin-form-header {
    background:
        radial-gradient(circle at top right, rgba(253, 184, 19, 0.22), transparent 28%),
        linear-gradient(135deg, #4b2c80, #2d1a4d);
    color: #ffffff;
    padding: 22px 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.admin-search-header span,
.admin-search-header h2,
.admin-search-header i,
.admin-sitin-form-header span,
.admin-sitin-form-header i {
    color: #ffffff;
}

.admin-search-close,
.admin-sitin-form-close {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    font-size: 25px;
    cursor: pointer;
    font-weight: 900;
}

.admin-search-close:hover,
.admin-sitin-form-close:hover {
    background: #fdb813;
    color: #2d1a4d;
}

.admin-search-body {
    padding: 24px 26px 28px;
    overflow-y: auto;
    background: #ffffff;
    scrollbar-width: thin;
    scrollbar-color: #fdb813 #ffffff;
}

.admin-search-body::-webkit-scrollbar,
#studentsList::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

.admin-search-body::-webkit-scrollbar-track,
#studentsList::-webkit-scrollbar-track {
    background: #ffffff;
    border-radius: 999px;
}

.admin-search-body::-webkit-scrollbar-thumb,
#studentsList::-webkit-scrollbar-thumb {
    background: #fdb813;
    border-radius: 999px;
}

.admin-search-label {
    display: block;
    margin-bottom: 10px;
    color: #4b2c80;
    font-size: 12px;
    font-weight: 950;
    text-transform: uppercase;
    letter-spacing: 1px;
}

#idSearchInput {
    width: 100%;
    min-height: 54px;
    padding: 12px 16px;
    border: 2px solid #4b2c80;
    border-radius: 18px;
    font-size: 15px;
    font-weight: 750;
    outline: none;
    margin-bottom: 28px;
    color: #111827;
    background: #ffffff;
    box-shadow: 0 0 0 5px rgba(75, 44, 128, 0.10);
}

#idSearchInput:focus {
    border-color: #4b2c80;
    box-shadow:
        0 0 0 5px rgba(75, 44, 128, 0.14),
        0 12px 26px rgba(75, 44, 128, 0.10);
}

#studentsList {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px;
    max-height: 470px;
    overflow-y: auto;
    padding-right: 8px;
}

.admin-student-card {
    background: #ffffff;
    border: 1px solid #ede9fe;
    border-radius: 18px;
    padding: 20px 14px 18px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(31, 16, 70, 0.08);
    transition: all 0.22s ease;
}

.admin-student-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 22px 48px rgba(31, 16, 70, 0.14);
}

.admin-student-avatar {
    width: 76px;
    height: 76px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4b2c80, #fdb813);
    border: 3px solid #fdb813;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 950;
    overflow: hidden;
}

.admin-student-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.admin-student-name {
    margin: 0 0 12px;
    color: #111827;
    font-size: 14px;
    font-weight: 950;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.admin-student-id {
    width: 100%;
    min-height: 28px;
    border-radius: 10px;
    background: #eef2ff;
    color: #4b2c80;
    font-size: 12px;
    font-weight: 950;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
}

.admin-student-remaining {
    margin: 0 0 14px;
    color: #64748b;
    font-size: 12px;
    font-weight: 850;
}

.admin-select-student-btn {
    width: 100%;
    min-height: 36px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #4b2c80, #6b3fa0);
    color: #ffffff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 950;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.admin-select-student-btn:hover {
    background: linear-gradient(135deg, #fdb813, #f59e0b);
    color: #2d1a4d;
}

.admin-no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #9ca3af;
    font-weight: 850;
}

/* =========================================================
   SIT-IN FORM MODAL
========================================================= */

#sitInFormModal {
    align-items: center;
    overflow: hidden;
}

#sitInFormModal .admin-sitin-form-card {
    width: min(640px, 100%);
    height: 82vh;
    max-height: 82vh;
    overflow: hidden;
    border-radius: 22px;
    background: #111827;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.40);
    border: 1px solid rgba(253, 184, 19, 0.28);
    display: flex;
    flex-direction: column;
}

#sitInFormModal form {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.admin-sitin-form-header {
    flex: 0 0 auto;
}

.admin-sitin-form-body {
    flex: 1 1 auto;
    min-height: 0;
    padding: 24px 22px 28px;
    background: #111827;
    overflow-y: scroll;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: #fdb813 #111827;
}

.admin-sitin-form-body::-webkit-scrollbar {
    width: 10px;
}

.admin-sitin-form-body::-webkit-scrollbar-track {
    background: #111827;
    border-radius: 999px;
}

.admin-sitin-form-body::-webkit-scrollbar-thumb {
    background: #fdb813;
    border-radius: 999px;
    border: 2px solid #111827;
}

.admin-sitin-form-body::-webkit-scrollbar-thumb:hover {
    background: #ffca2c;
}

.admin-sitin-form-group {
    margin-bottom: 16px;
}

.admin-sitin-form-group label,
.admin-sitin-form-row label {
    display: block;
    margin-bottom: 8px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 950;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}

.admin-sitin-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 16px;
}


.admin-sitin-form-card input:focus,
.admin-sitin-form-card select:focus {
    border-color: #fdb813;
    box-shadow:
        0 0 0 4px rgba(253, 184, 19, 0.18),
        0 0 24px rgba(253, 184, 19, 0.16);
}

.admin-sitin-form-card option {
    background: #020617;
    color: #ffffff;
}

.admin-sitin-form-footer {
    flex: 0 0 auto;
    padding: 14px 22px;
    background: #111827;
    border-top: 1px solid rgba(148, 163, 184, 0.28);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.admin-modal-btn {
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 950;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.admin-modal-btn-close {
    background: #fdb813;
    color: #2d1a4d;
}

.admin-modal-btn-submit {
    background: linear-gradient(135deg, #4b2c80, #6b3fa0);
    color: #ffffff;
}

.admin-modal-btn-submit:hover {
    background: linear-gradient(135deg, #fdb813, #f59e0b);
    color: #2d1a4d;
}

/* PC GRID */
.admin-sitin-form-group.full-width {
    grid-column: 1 / -1;
}

.sitin-pc-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: #0f172a;
    border: 1px solid rgba(253, 184, 19, 0.35);
    color: #ffffff;
    font-size: 12px;
    font-weight: 900;
}

.sitin-pc-legend {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    color: #dbeafe;
    font-size: 11px;
}

.sitin-pc-legend .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.sitin-pc-legend .dot.available {
    background: #16a34a;
}

.sitin-pc-legend .dot.maintenance {
    background: #dc2626;
}

.sitin-pc-legend .dot.selected {
    background: #fdb813;
}

.sitin-pc-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    padding: 10px;
    border-radius: 18px;
    background: #0f172a;
    border: 1px solid rgba(253, 184, 19, 0.25);
    overflow: visible;
}

.sitin-pc-card {
    position: relative;
    min-height: 54px;
    border: 1.8px solid rgba(34, 197, 94, 0.55);
    border-radius: 13px;
    background: rgba(22, 163, 74, 0.22);
    color: #ffffff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    font-weight: 950;
    padding: 8px 11px;
    transition: all 0.22s ease;
}

.sitin-pc-card strong {
    color: #ffffff;
    font-size: 13px;
    line-height: 1.1;
}

.sitin-pc-card small {
    margin-top: 3px;
    color: #bbf7d0;
    font-size: 10px;
    font-weight: 850;
}

.sitin-pc-card:hover {
    transform: translateY(-2px);
    border-color: #86efac;
    box-shadow: 0 10px 20px rgba(22, 163, 74, 0.18);
}

.sitin-pc-card.selected {
    background: linear-gradient(135deg, #4b2c80, #6b3fa0);
    border-color: #fdb813;
    box-shadow:
        0 0 0 3px rgba(253, 184, 19, 0.18),
        0 12px 26px rgba(75, 44, 128, 0.30);
}

.sitin-pc-card.selected small {
    color: #fde68a;
}

.sitin-pc-card .pc-check {
    display: none;
    position: absolute;
    top: 7px;
    right: 9px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fdb813;
    color: #2d1a4d;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 950;
}

.sitin-pc-card.selected .pc-check {
    display: inline-flex;
}

.sitin-pc-card.maintenance {
    background: rgba(220, 38, 38, 0.24);
    border-color: #ef4444;
    opacity: 0.95;
    cursor: not-allowed;
}

.sitin-pc-card.maintenance strong {
    color: #ffffff;
}

.sitin-pc-card.maintenance small {
    color: #fecaca;
}

.sitin-pc-card.maintenance:hover {
    transform: none;
    box-shadow: none;
}

.sitin-pc-card:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.sitin-pc-card:disabled:hover {
    transform: none;
    box-shadow: none;
}

        width: 100%;
        height: 92vh;
        max-height: 92vh;
    }

    .admin-sitin-form-row {
        grid-template-columns: 1fr;
    }

    .sitin-pc-toolbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .sitin-pc-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 520px) {
    #studentsList {
        grid-template-columns: 1fr !important;
    }

    .sitin-pc-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>

<!-- SEARCH MODAL -->
<div id="searchModal" class="admin-search-overlay">
    <div class="admin-search-modal">
        <div class="admin-search-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-search"></i>
                <span>Quick Select Student</span>
            </div>

            <button type="button" class="admin-search-close" onclick="adminCloseModal('searchModal')">
                &times;
            </button>
        </div>

        <div class="admin-search-body">
            <label class="admin-search-label">Search or Browse Students</label>

            <input
                type="text"
                id="idSearchInput"
                placeholder="Type to search by ID or name..."
                onkeyup="adminFilterStudents(event)"
            >

            <div id="studentsList"></div>

            <div id="noResults" class="admin-no-results" style="display:none;">
                <i class="fas fa-inbox" style="font-size:42px; color:#d1d5db; margin-bottom:12px; display:block;"></i>
                <p style="margin:0;">No students found</p>
            </div>
        </div>
    </div>
</div>

<!-- SIT-IN FORM MODAL -->
<div id="sitInFormModal">
    <div class="admin-sitin-form-card">
        <div class="admin-sitin-form-header">
            <span>
                <i class="fas fa-desktop" style="margin-right:8px;"></i>
                Sit-In Form
            </span>

            <button type="button" class="admin-sitin-form-close" onclick="adminCloseModal('sitInFormModal')">
                &times;
            </button>
        </div>

        <form action="{{ url_for('admin_sitin') }}" method="POST" id="adminSitInForm">
            <div class="admin-sitin-form-body">
                <div class="admin-sitin-form-group">
                    <label>ID Number</label>
                    <input type="text" name="id_number" id="display_id" readonly>
                </div>

                <div class="admin-sitin-form-group">
                    <label>Student Name</label>
                    <input type="text" id="display_name" readonly>
                </div>

                <div class="admin-sitin-form-row">
                    <div>
                        <label>Purpose</label>
                        <select name="purpose" required>
                            <option value="" disabled selected>Select purpose</option>
                            <option value="C Programming">C Programming</option>
                            <option value="Java">Java</option>
                            <option value="PHP">PHP</option>
                            <option value="Python">Python</option>
                            <option value="Database">Database</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label>Lab</label>
                        <select name="lab" id="sitInLab" required>
                            <option value="" disabled selected>Select lab</option>
                            <option value="524">524</option>
                            <option value="526">526</option>
                            <option value="528">528</option>
                            <option value="530">530</option>
                            <option value="542">542</option>
                            <option value="544">544</option>
                        </select>
                    </div>
                </div>

                <div class="admin-sitin-form-row">
                    <div>
                        <label>Date</label>
                        <input type="date" name="date" id="sitInDate" required readonly>
                    </div>
                    <div>
                        <label>Time</label>
                        <input type="time" name="time" id="sitInTime" required readonly>
                    </div>
                </div>

                <div class="admin-sitin-form-group full-width">
                    <label>PC</label>

                    <input type="hidden" name="pc_number" id="sitInPC">

                    <div class="sitin-pc-toolbar">
                        <span id="sitinPcStatusText">
                            Select a lab first to load PC status.
                        </span>

                        <span class="sitin-pc-legend">
                            <b class="dot available"></b> Available
                            <b class="dot maintenance"></b> Maintenance
                            <b class="dot selected"></b> Selected
                        </span>
                    </div>

                    <div class="sitin-pc-grid" id="sitInPCGrid">
                        {% for i in range(1, 51) %}
                        <button type="button" class="sitin-pc-card" data-pc="{{ i }}" disabled>
                            <span class="pc-check">✓</span>
                            <strong>PC {{ i }}</strong>
                            <small>Select lab</small>
                        </button>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="admin-sitin-form-footer">
                <button type="button" class="admin-modal-btn admin-modal-btn-close" onclick="adminCloseModal('sitInFormModal')">
                    Close
                </button>

                <button type="submit" class="admin-modal-btn admin-modal-btn-submit">
                    Confirm Sit-In
                </button>
            </div>
        </form>
    </div>
</div>

<script>
window.adminAllStudents = window.adminAllStudents || [];
let adminMaintenanceMap = {};

function openSearchModal() {
    const modal = document.getElementById('searchModal');
    const input = document.getElementById('idSearchInput');

    if (modal) {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    adminLoadAllStudents();

    if (input) {
        input.value = '';

        setTimeout(function() {
            input.focus();
        }, 100);
    }
}

function adminCloseModal(modalId) {
    const modal = document.getElementById(modalId);

    if (modal) {
        modal.style.display = 'none';
    }

    const searchModal = document.getElementById('searchModal');
    const sitInModal = document.getElementById('sitInFormModal');

    const searchOpen = searchModal && searchModal.style.display === 'flex';
    const sitInOpen = sitInModal && sitInModal.style.display === 'flex';

    if (!searchOpen && !sitInOpen) {
        document.body.style.overflow = '';
    }
}

function closeModal(modalId) {
    adminCloseModal(modalId);
}

function adminLoadAllStudents() {
    fetch('/admin/search-students?q=')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            window.adminAllStudents = data.students || [];
            adminDisplayStudents(window.adminAllStudents);
        })
        .catch(function(error) {
            console.error('Error loading students:', error);

            const studentsList = document.getElementById('studentsList');

            if (studentsList) {
                studentsList.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;">Error loading students</p>';
            }
        });
}

function adminFilterStudents(event) {
    const query = event.target.value.trim().toLowerCase();

    if (!window.adminAllStudents || window.adminAllStudents.length === 0) {
        adminLoadAllStudents();
        return;
    }

    const filtered = window.adminAllStudents.filter(function(student) {
        return String(student.id_number || '').toLowerCase().includes(query) ||
               String(student.first_name || '').toLowerCase().includes(query) ||
               String(student.last_name || '').toLowerCase().includes(query);
    });

    adminDisplayStudents(filtered);
}

function filterStudents(event) {
    adminFilterStudents(event);
}

function adminDisplayStudents(students) {
    const studentsList = document.getElementById('studentsList');
    const noResults = document.getElementById('noResults');

    if (!studentsList) {
        return;
    }

    studentsList.innerHTML = '';

    if (!students || students.length === 0) {
        if (noResults) {
            noResults.style.display = 'block';
        }

        return;
    }

    if (noResults) {
        noResults.style.display = 'none';
    }

    students.forEach(function(student) {
        const idNumber = student.id_number || '';
        const firstName = student.first_name || '';
        const lastName = student.last_name || '';
        const remaining = student.remaining || student.remaining_sessions || 0;
        const studentName = `${firstName} ${lastName}`.trim();
        const photoPath = `/static/uploads/${idNumber}.png`;
        const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase();

        const studentCard = document.createElement('div');
        studentCard.className = 'admin-student-card';

        studentCard.innerHTML = `
            <div class="admin-student-avatar">
                <img
                    src="${photoPath}"
                    alt="${studentName}"
                    onerror="this.style.display='none'; this.parentElement.textContent='${initials}';"
                >
            </div>

            <div class="admin-student-name">${studentName}</div>
            <div class="admin-student-id">${idNumber}</div>
            <div class="admin-student-remaining">${remaining} sessions left</div>

            <button type="button" class="admin-select-student-btn">
                Select Student
            </button>
        `;

        const selectButton = studentCard.querySelector('.admin-select-student-btn');

        if (selectButton) {
            selectButton.addEventListener('click', function() {
                adminOpenSitInForm(idNumber, studentName, remaining);
            });
        }

        studentsList.appendChild(studentCard);
    });
}

function displayStudents(students) {
    adminDisplayStudents(students);
}

function getLocalDateString() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

function getLocalTimeString() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');

    return `${hours}:${minutes}`;
}

function resetSitInPCGrid() {
    const pcInput = document.getElementById('sitInPC');
    const statusText = document.getElementById('sitinPcStatusText');

    if (pcInput) {
        pcInput.value = '';
    }

    document.querySelectorAll('#sitInPCGrid .sitin-pc-card').forEach(function(card) {
        card.classList.remove('selected', 'maintenance');
        card.disabled = true;

        const smallText = card.querySelector('small');

        if (smallText) {
            smallText.textContent = 'Select lab';
        }
    });

    if (statusText) {
        statusText.textContent = 'Select a lab first to load PC status.';
    }
}

function fillSitInLocalDateTime() {
    const dateInput = document.getElementById('sitInDate');
    const timeInput = document.getElementById('sitInTime');

    if (dateInput) {
        dateInput.value = getLocalDateString();
        dateInput.min = getLocalDateString();
    }

    if (timeInput) {
        timeInput.value = getLocalTimeString();
    }
}

function adminOpenSitInForm(idNumber, studentName, remaining) {
    const idInput = document.getElementById('display_id');
    const nameInput = document.getElementById('display_name');
    const labSelect = document.getElementById('sitInLab');
    const purposeSelect = document.querySelector('#sitInFormModal select[name="purpose"]');

    if (idInput) {
        idInput.value = idNumber;
    }

    if (nameInput) {
        nameInput.value = studentName;
    }

    fillSitInLocalDateTime();

    if (labSelect) {
        labSelect.selectedIndex = 0;
    }

    if (purposeSelect) {
        purposeSelect.selectedIndex = 0;
    }

    resetSitInPCGrid();
    adminCloseModal('searchModal');

    const sitInModal = document.getElementById('sitInFormModal');

    if (sitInModal) {
        sitInModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    loadAdminMaintenanceStatus();
}

function openSitInForm(idNumber, studentName, remaining) {
    adminOpenSitInForm(idNumber, studentName, remaining);
}

function loadAdminMaintenanceStatus() {
    return fetch('/admin/lab-maintenance/status')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            adminMaintenanceMap = data || {};
            refreshSitInPCGrid();
        })
        .catch(function(error) {
            console.error('Maintenance status error:', error);
            adminMaintenanceMap = {};
            refreshSitInPCGrid();
        });
}

function refreshSitInPCGrid() {
    const labSelect = document.getElementById('sitInLab');
    const pcInput = document.getElementById('sitInPC');
    const statusText = document.getElementById('sitinPcStatusText');
    const pcCards = document.querySelectorAll('#sitInPCGrid .sitin-pc-card');

    if (!labSelect || !pcInput || !statusText) {
        return;
    }

    const lab = String(labSelect.value || '').trim();
    const maintenancePCs = (adminMaintenanceMap[lab] || []).map(Number);

    pcInput.value = '';

    pcCards.forEach(function(card) {
        const pcNumber = Number(card.dataset.pc);
        const smallText = card.querySelector('small');

        card.classList.remove('selected', 'maintenance');

        if (!lab) {
            card.disabled = true;

            if (smallText) {
                smallText.textContent = 'Select lab';
            }

            return;
        }

        if (maintenancePCs.includes(pcNumber)) {
            card.classList.add('maintenance');
            card.disabled = true;

            if (smallText) {
                smallText.textContent = 'Maintenance';
            }
        } else {
            card.disabled = false;

            if (smallText) {
                smallText.textContent = 'Available';
            }
        }
    });

    if (!lab) {
        statusText.textContent = 'Select a lab first to load PC status.';
        return;
    }

    statusText.textContent = `Lab ${lab}: ${maintenancePCs.length} PC(s) under maintenance.`;
}

function selectSitInPC(card) {
    const pcInput = document.getElementById('sitInPC');

    if (!pcInput || !card || card.disabled || card.classList.contains('maintenance')) {
        return;
    }

    document.querySelectorAll('#sitInPCGrid .sitin-pc-card').forEach(function(item) {
        item.classList.remove('selected');
    });

    card.classList.add('selected');
    pcInput.value = card.dataset.pc;
}

document.addEventListener('DOMContentLoaded', function() {
    const labSelect = document.getElementById('sitInLab');
    const sitInForm = document.getElementById('adminSitInForm');
    const sitInDateInput = document.getElementById('sitInDate');

    if (sitInDateInput) {
        sitInDateInput.min = getLocalDateString();
    }

    if (labSelect) {
        labSelect.addEventListener('change', function() {
            loadAdminMaintenanceStatus();
        });
    }

    document.querySelectorAll('#sitInPCGrid .sitin-pc-card').forEach(function(card) {
        card.addEventListener('click', function() {
            selectSitInPC(card);
        });
    });

    if (sitInForm) {
    sitInForm.addEventListener('submit', function(event) {
        const pcInput = document.getElementById('sitInPC');
        const dateInput = document.getElementById('sitInDate');
        const timeInput = document.getElementById('sitInTime');

        if (dateInput) {
            dateInput.value = getLocalDateString();
        }

        if (timeInput) {
            timeInput.value = getLocalTimeString();
        }

        if (!pcInput || !pcInput.value) {
            event.preventDefault();
            alert('Please select an available PC before confirming sit-in.');
            return;
        }
    });
}

    resetSitInPCGrid();
    loadAdminMaintenanceStatus();
});
</script>
