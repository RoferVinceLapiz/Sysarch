<script>
window.adminAllStudents = window.adminAllStudents || [];

function openSearchModal() {
    const modal = document.getElementById('searchModal');
    const input = document.getElementById('idSearchInput');

    if (modal) {
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    adminLoadAllStudents();

    if (input) {
        input.value = '';

        setTimeout(function() {
            input.focus();
        }, 100);
    }
}

function adminCloseModal(modalId) {
    const modal = document.getElementById(modalId);

    if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = '';
    }
}

function closeModal(modalId) {
    adminCloseModal(modalId);
}

function adminLoadAllStudents() {
    fetch('/admin/search-students?q=')
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            window.adminAllStudents = data.students || [];
            adminDisplayStudents(window.adminAllStudents);
        })
        .catch(function(error) {
            console.error('Error loading students:', error);

            const studentsList = document.getElementById('studentsList');

            if (studentsList) {
                studentsList.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;">Error loading students</p>';
            }
        });
}

function adminFilterStudents(event) {
    const query = event.target.value.trim().toLowerCase();

    if (!window.adminAllStudents || window.adminAllStudents.length === 0) {
        adminLoadAllStudents();
        return;
    }

    const filtered = window.adminAllStudents.filter(function(student) {
        return String(student.id_number || '').toLowerCase().includes(query) ||
               String(student.first_name || '').toLowerCase().includes(query) ||
               String(student.last_name || '').toLowerCase().includes(query);
    });

    adminDisplayStudents(filtered);
}

function filterStudents(event) {
    adminFilterStudents(event);
}

function adminDisplayStudents(students) {
    const studentsList = document.getElementById('studentsList');
    const noResults = document.getElementById('noResults');

    if (!studentsList) {
        return;
    }

    studentsList.innerHTML = '';

    if (!students || students.length === 0) {
        if (noResults) {
            noResults.style.display = 'block';
        }

        return;
    }

    if (noResults) {
        noResults.style.display = 'none';
    }

    students.forEach(function(student) {
        const idNumber = student.id_number || '';
        const firstName = student.first_name || '';
        const lastName = student.last_name || '';
        const remaining = student.remaining || student.remaining_sessions || 0;
        const studentName = `${firstName} ${lastName}`.trim();
        const photoPath = `/static/uploads/${idNumber}.png`;
        const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase();

        const studentCard = document.createElement('div');
        studentCard.className = 'admin-student-card';

        studentCard.innerHTML = `
            <div class="admin-student-avatar">
                <img
                    src="${photoPath}"
                    alt="${studentName}"
                    onerror="this.style.display='none'; this.parentElement.textContent='${initials}';"
                >
            </div>

            <div class="admin-student-name">${studentName}</div>
            <div class="admin-student-id">${idNumber}</div>
            <div class="admin-student-remaining">${remaining} sessions left</div>

            <button type="button" class="admin-select-student-btn">
                Select Student
            </button>
        `;

        const selectButton = studentCard.querySelector('.admin-select-student-btn');

        selectButton.addEventListener('click', function() {
            adminOpenSitInForm(idNumber, studentName, remaining);
        });

        studentsList.appendChild(studentCard);
    });
}

function displayStudents(students) {
    adminDisplayStudents(students);
}

function adminOpenSitInForm(idNumber, studentName, remaining) {
    const idInput = document.getElementById('display_id');
    const nameInput = document.getElementById('display_name');
    const remainingInput = document.getElementById('display_remaining');
    const dateInput = document.getElementById('sitInDate');
    const timeInput = document.getElementById('sitInTime');
    const pcInput = document.getElementById('sitInPC');
    const now = new Date();

    if (idInput) {
        idInput.value = idNumber;
    }

    if (nameInput) {
        nameInput.value = studentName;
    }

    if (remainingInput) {
        remainingInput.value = remaining;
    }

    if (dateInput) {
        dateInput.value = now.toISOString().slice(0, 10);
    }

    if (timeInput) {
        timeInput.value = now.toTimeString().slice(0, 5);
    }

    if (pcInput) {
        pcInput.selectedIndex = 0;
    }

    adminCloseModal('searchModal');

    const sitInModal = document.getElementById('sitInFormModal');

    if (sitInModal) {
        sitInModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
}

function openSitInForm(idNumber, studentName, remaining) {
    adminOpenSitInForm(idNumber, studentName, remaining);
}

document.addEventListener('click', function(event) {
    const searchModal = document.getElementById('searchModal');
    const sitInModal = document.getElementById('sitInFormModal');

    if (searchModal && event.target === searchModal) {
        adminCloseModal('searchModal');
    }

    if (sitInModal && event.target === sitInModal) {
        adminCloseModal('sitInFormModal');
    }
});

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        adminCloseModal('searchModal');
        adminCloseModal('sitInFormModal');
    }
});
</script>
